[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mam4-jax"
version = "0.0.1"
description = "JAX port of the MAM4 aerosol-microphysics box model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
    "numpy>=1.24",
    "netCDF4>=1.6",
    "pyyaml>=6",
    "matplotlib>=3.7",
    "diffrax>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mam4_jax*"]

# Ship the binary data files that live inside the package and are loaded at
# import time (e.g. mam4_jax/_coag_tables.npz, read by mam4_jax/coag.py). Without
# this they are dropped from the built wheel, so `pip install` yields an install
# that raises FileNotFoundError on `import mam4_jax`.
[tool.setuptools.package-data]
mam4_jax = ["*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
